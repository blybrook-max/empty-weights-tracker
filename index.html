<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Empty Weights Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:24px 18px}main{max-width:700px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f9fafb;border-radius:12px;padding:12px}
.num{font-size:22px;font-weight:800}.label{font-size:11px;color:#6b7280}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:15px;margin:3px}
.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.truck{font-size:19px;font-weight:800}.weight{font-size:18px;font-weight:800}
.muted{color:#6b7280;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}.ok{background:#dcfce7;color:#166534}.soon{background:#fef3c7;color:#92400e}.over{background:#fee2e2;color:#991b1b}
input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:6px}label{display:block;font-weight:700;font-size:13px;margin-top:12px}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end}.sheet{background:white;width:100%;padding:20px;border-radius:20px 20px 0 0}
.hidden{display:none}
</style></head><body>
<header><h1>Empty Weights Tracker</h1><div>New empty weights every 30 days</div></header>
<main><div class="card"><div class="stats">
<div class="stat"><div class="num" id="count">0</div><div class="label">TRUCKS</div></div>
<div class="stat"><div class="num" id="soon">0</div><div class="label">DUE SOON</div></div>
<div class="stat"><div class="num" id="over">0</div><div class="label">OVERDUE</div></div>
</div></div>
<button class="primary full" onclick="addForm()">＋ Add Truck</button><div id="list"></div></main>
<div id="modal" class="hidden"><div class="sheet">
<h2 id="title">Add Truck</h2><input type="hidden" id="id">
<label>Truck number / name<input id="name" placeholder="Truck 12"></label>
<label>Empty weight (lb)<input id="weight" type="number" placeholder="28640"></label>
<label>Date weighed<input id="last" type="date"></label>
<label>Quarry<input id="quarry" placeholder="Quarry name"></label>
<label>Notes<textarea id="notes" rows="3"></textarea></label>
<br><button class="primary" onclick="save()">Save</button><button onclick="closeForm()">Cancel</button>
</div></div>
<script>
let trucks=JSON.parse(localStorage.getItem("ewt")||"[]");
const fmt=n=>new Intl.NumberFormat().format(n);
function date(d){return new Date(d+"T12:00:00").toLocaleDateString()}
function due(d){let a=new Date(d+"T12:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.ceil((a-b)/86400000)}
function esc(s){return String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function render(){
 count.textContent=trucks.length;soon.textContent=trucks.filter(x=>due(x.next)>=0&&due(x.next)<=7).length;over.textContent=trucks.filter(x=>due(x.next)<0).length;
 list.innerHTML=trucks.sort((a,b)=>a.next.localeCompare(b.next)).map(t=>{let d=due(t.next),cl=d<0?"over":d<=7?"soon":"ok",s=d<0?"OVERDUE by "+(-d)+" days":d==0?"DUE TODAY":d<=7?"DUE IN "+d+" DAYS":"DUE "+date(t.next);
 return `<div class="card"><div class="row"><div><div class="truck">${esc(t.name)}</div><div class="muted">${esc(t.quarry||"No quarry")}</div></div><div class="weight">${fmt(t.weight)} lb</div></div><div class="muted">Last weighed: ${date(t.last)}</div><span class="pill ${cl}">${s}</span>${t.notes?`<p class="muted">${esc(t.notes)}</p>`:""}<br><button onclick="renew('${t.id}')">＋ New Weight</button><button onclick="edit('${t.id}')">Edit</button><button class="danger" onclick="del('${t.id}')">Delete</button></div>`}).join("")||'<div class="card" style="text-align:center"><h2>No trucks yet</h2><p class="muted">Add your first truck.</p></div>'
}
function addForm(){title.textContent="Add Truck";id.value="";name.value="";weight.value="";quarry.value="";notes.value="";last.value=new Date().toISOString().slice(0,10);modal.classList.remove("hidden")}
function closeForm(){modal.classList.add("hidden")}
function save(){if(!name.value||!weight.value||!last.value)return alert("Enter truck, weight, and date.");let t={id:id.value||crypto.randomUUID(),name:name.value,weight:Number(weight.value),last:last.value,next:new Date(new Date(last.value+"T12:00:00").getTime()+30*86400000).toISOString().slice(0,10),quarry:quarry.value,notes:notes.value};let i=trucks.findIndex(x=>x.id===t.id);i<0?trucks.push(t):trucks[i]=t;localStorage.setItem("ewt",JSON.stringify(trucks));closeForm();render()}
function edit(x){let t=trucks.find(a=>a.id===x);title.textContent="Edit Truck";id.value=t.id;name.value=t.name;weight.value=t.weight;last.value=t.last;quarry.value=t.quarry;notes.value=t.notes;modal.classList.remove("hidden")}
function renew(x){let t=trucks.find(a=>a.id===x),w=prompt("New empty weight (lb):",t.weight);if(!w)return;let today=new Date().toISOString().slice(0,10);t.weight=Number(w);t.last=today;t.next=new Date(Date.now()+30*86400000).toISOString().slice(0,10);localStorage.setItem("ewt",JSON.stringify(trucks));render()}
function del(x){if(confirm("Delete this truck?")){trucks=trucks.filter(t=>t.id!==x);localStorage.setItem("ewt",JSON.stringify(trucks));render()}}
render();
</script></body></html>

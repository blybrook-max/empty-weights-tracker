<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Empty Weights Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:24px 18px}main{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f9fafb;border-radius:12px;padding:12px}.num{font-size:22px;font-weight:800}.label{font-size:11px;color:#6b7280}
button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700;margin:3px;background:#e5e7eb}button.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.truck{font-size:19px;font-weight:800}.weight{font-size:18px;font-weight:800}.muted{font-size:13px;color:#6b7280}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}.ok{background:#dcfce7;color:#166534}.soon{background:#fef3c7;color:#92400e}.over{background:#fee2e2;color:#991b1b}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
input,textarea{display:block;width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:6px;background:#fff}
label{display:block;font-size:13px;font-weight:700;margin-top:12px}
@media(min-width:700px){#modal{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>
<header><h1 style="margin:0">Empty Weights Tracker</h1><div style="opacity:.75;margin-top:5px">New empty weights every 30 days</div></header>
<main>
<div class="card"><div class="stats"><div class="stat"><div id="count" class="num">0</div><div class="label">TRUCKS</div></div><div class="stat"><div id="soon" class="num">0</div><div class="label">DUE SOON</div></div><div class="stat"><div id="over" class="num">0</div><div class="label">OVERDUE</div></div></div></div>
<button id="add" class="primary full">＋ Add Truck</button>
<div id="list"></div>
</main>

<div id="modal">
<div class="sheet" id="sheet">
<div class="row"><h2 id="title" style="margin:0">Add Truck</h2><button type="button" id="x">✕</button></div>
<input type="hidden" id="id">
<label>Truck number / name<input id="name" autocomplete="off" placeholder="Truck 12"></label>
<label>Empty weight (lb)<input id="weight" type="number" inputmode="numeric" placeholder="28640"></label>
<label>Date weighed<input id="last" type="date"></label>
<label>Quarry<input id="quarry" autocomplete="off" placeholder="Quarry name"></label>
<label>Notes<textarea id="notes" rows="3" placeholder="Optional notes"></textarea></label>
<div style="margin-top:14px"><button type="button" id="save" class="primary">Save Truck</button><button type="button" id="cancel">Cancel</button></div>
</div>
</div>

<script>
(function(){
var KEY="empty_weights_tracker_popup_fixed_v5", trucks=[];
function $(id){return document.getElementById(id)}
function today(){return new Date().toISOString().slice(0,10)}
function plus30(s){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+30);return d.toISOString().slice(0,10)}
function days(s){var d=new Date(s+"T12:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function fmt(n){return Number(n).toLocaleString()}
function df(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function load(){try{trucks=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(trucks))trucks=[]}catch(e){trucks=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(trucks));return true}catch(e){alert("Saving is unavailable. Open this app in normal Safari, not Private Browsing.");return false}}
function closeModal(){ $("modal").classList.remove("open"); document.body.style.overflow=""; }
function openModal(t){
 $("title").textContent=t?"Edit Truck":"Add Truck";
 $("id").value=t?t.id:""; $("name").value=t?t.name:""; $("weight").value=t?t.weight:"";
 $("last").value=t?t.last:today(); $("quarry").value=t?t.quarry:""; $("notes").value=t?t.notes:"";
 $("modal").classList.add("open"); document.body.style.overflow="hidden";
 setTimeout(function(){$("name").focus()},50);
}
function render(){
 var soon=0,over=0;
 trucks.forEach(function(t){var d=days(t.next);if(d>=0&&d<=7)soon++;if(d<0)over++});
 $("count").textContent=trucks.length;$("soon").textContent=soon;$("over").textContent=over;
 trucks.sort(function(a,b){return a.next.localeCompare(b.next)});
 if(!trucks.length){$("list").innerHTML='<div class="card" style="text-align:center"><div style="font-size:40px">🚛</div><h2>No trucks yet</h2><p class="muted">Tap Add Truck to get started.</p></div>';return}
 $("list").innerHTML=trucks.map(function(t){
 var d=days(t.next),cl=d<0?"over":d<=7?"soon":"ok",s=d<0?"OVERDUE by "+(-d)+" days":d===0?"DUE TODAY":d<=7?"DUE IN "+d+" DAYS":"DUE "+df(t.next);
 return '<div class="card"><div class="row"><div><div class="truck">'+esc(t.name)+'</div><div class="muted">'+esc(t.quarry||"No quarry")+'</div></div><div class="weight">'+fmt(t.weight)+' lb</div></div><div class="muted" style="margin-top:9px">Last weighed: '+df(t.last)+'</div><span class="pill '+cl+'">'+s+'</span>'+(t.notes?'<p class="muted">'+esc(t.notes)+'</p>':'')+'<div style="margin-top:10px"><button type="button" data-new="'+t.id+'">＋ New Weight</button><button type="button" data-edit="'+t.id+'">Edit</button><button type="button" class="danger" data-del="'+t.id+'">Delete</button></div></div>';
 }).join("");
}
$("add").onclick=function(){openModal(null)};
$("x").onclick=function(e){e.preventDefault();e.stopPropagation();closeModal()};
$("cancel").onclick=function(e){e.preventDefault();e.stopPropagation();closeModal()};
$("modal").onclick=function(e){if(e.target===$("modal"))closeModal()};
$("sheet").onclick=function(e){e.stopPropagation()};
$("save").onclick=function(e){
 e.preventDefault();e.stopPropagation();
 var name=$("name").value.trim(), weight=parseInt($("weight").value,10), last=$("last").value;
 if(!name||!weight||!last){alert("Please enter the truck, empty weight, and date weighed.");return}
 var id=$("id").value||("t-"+Date.now()+"-"+Math.random().toString(36).slice(2));
 var t={id:id,name:name,weight:weight,last:last,next:plus30(last),quarry:$("quarry").value.trim(),notes:$("notes").value.trim()};
 var i=trucks.findIndex(function(x){return x.id===id});if(i<0)trucks.push(t);else trucks[i]=t;
 if(persist()){closeModal();render();}
};
$("list").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 var id=b.getAttribute("data-new")||b.getAttribute("data-edit")||b.getAttribute("data-del");
 var t=trucks.find(function(x){return x.id===id});if(!t)return;
 if(b.hasAttribute("data-edit"))openModal(t);
 else if(b.hasAttribute("data-new")){var w=prompt("New empty weight (lb):",t.weight);if(w===null)return;w=parseInt(w,10);if(!w)return alert("Enter a valid weight.");t.weight=w;t.last=today();t.next=plus30(t.last);if(persist())render()}
 else if(b.hasAttribute("data-del")&&confirm("Delete this truck?")){trucks=trucks.filter(function(x){return x.id!==id});persist();render()}
};
load();render();
})();
</script>
</body>
</html>

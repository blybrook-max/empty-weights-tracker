<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Empty Weights Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:24px 18px}main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #0001}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f9fafb;border-radius:12px;padding:12px}.num{font-size:22px;font-weight:800}.label{font-size:11px;color:#6b7280}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;font-size:15px;margin:3px;background:#e5e7eb}button.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.full{width:100%}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.truck{font-size:19px;font-weight:800}.weight{font-size:18px;font-weight:800}.muted{color:#6b7280;font-size:13px}
.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;margin-top:8px}.ok{background:#dcfce7;color:#166534}.soon{background:#fef3c7;color:#92400e}.over{background:#fee2e2;color:#991b1b}
input,textarea{display:block;width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:6px;background:white}label{display:block;font-weight:700;font-size:13px;margin-top:12px}
.hidden{display:none}#modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end}.sheet{background:white;width:100%;padding:20px;border-radius:20px 20px 0 0}
@media(min-width:700px){#modal{align-items:center}.sheet{max-width:600px;margin:auto;border-radius:20px}}
</style></head><body>
<header><h1 style="margin:0">Empty Weights Tracker</h1><div style="opacity:.75;margin-top:5px">New empty weights every 30 days</div></header>
<main>
<div class="card"><div class="stats"><div class="stat"><div id="count" class="num">0</div><div class="label">TRUCKS</div></div><div class="stat"><div id="soon" class="num">0</div><div class="label">DUE SOON</div></div><div class="stat"><div id="over" class="num">0</div><div class="label">OVERDUE</div></div></div></div>
<button id="add" class="primary full">＋ Add Truck</button><div id="list"></div></main>
<div id="modal" class="hidden"><div class="sheet">
<div class="row"><h2 id="title" style="margin:0">Add Truck</h2><button id="close">✕</button></div>
<input type="hidden" id="id">
<label>Truck number / name<input id="name" placeholder="Truck 12"></label>
<label>Empty weight (lb)<input id="weight" type="number" inputmode="numeric" placeholder="28640"></label>
<label>Date weighed<input id="last" type="date"></label>
<label>Quarry<input id="quarry" placeholder="Quarry name"></label>
<label>Notes<textarea id="notes" rows="3" placeholder="Optional notes"></textarea></label>
<div style="margin-top:14px"><button id="save" class="primary">Save Truck</button><button id="cancel">Cancel</button></div>
</div></div>
<script>
const KEY="empty_weights_tracker_saved_v3";
let trucks=[];
const $=x=>document.getElementById(x);
function today(){return new Date().toISOString().slice(0,10)}
function add30(s){let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+30);return d.toISOString().slice(0,10)}
function days(s){let d=new Date(s+"T12:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function money(n){return Number(n).toLocaleString()}
function df(s){return new Date(s+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function esc(s){return String(s||"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function load(){try{trucks=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(trucks))trucks=[]}catch(e){trucks=[]}}
function saveData(){try{localStorage.setItem(KEY,JSON.stringify(trucks));return true}catch(e){alert("The iPhone could not access local storage. Open the app in normal Safari, not Private Browsing.");return false}}
function render(){
 $("count").textContent=trucks.length;
 $("soon").textContent=trucks.filter(t=>days(t.next)>=0&&days(t.next)<=7).length;
 $("over").textContent=trucks.filter(t=>days(t.next)<0).length;
 trucks.sort((a,b)=>a.next.localeCompare(b.next));
 $("list").innerHTML=trucks.length?trucks.map(t=>{let d=days(t.next),c=d<0?"over":d<=7?"soon":"ok",s=d<0?"OVERDUE by "+(-d)+" days":d===0?"DUE TODAY":d<=7?"DUE IN "+d+" DAYS":"DUE "+df(t.next);
 return `<div class="card"><div class="row"><div><div class="truck">${esc(t.name)}</div><div class="muted">${esc(t.quarry||"No quarry")}</div></div><div class="weight">${money(t.weight)} lb</div></div><div class="muted" style="margin-top:9px">Last weighed: ${df(t.last)}</div><span class="pill ${c}">${s}</span>${t.notes?`<p class="muted">${esc(t.notes)}</p>`:""}<div style="margin-top:10px"><button data-new="${t.id}">＋ New Weight</button><button data-edit="${t.id}">Edit</button><button class="danger" data-del="${t.id}">Delete</button></div></div>`}).join(""):'<div class="card" style="text-align:center"><h2>No trucks yet</h2><p class="muted">Tap Add Truck to get started.</p></div>'
}
function open(t=null){$("title").textContent=t?"Edit Truck":"Add Truck";$("id").value=t?.id||"";$("name").value=t?.name||"";$("weight").value=t?.weight||"";$("last").value=t?.last||today();$("quarry").value=t?.quarry||"";$("notes").value=t?.notes||"";$("modal").classList.remove("hidden")}
function close(){$("modal").classList.add("hidden")}
$("add").onclick=()=>open();$("close").onclick=close;$("cancel").onclick=close;
$("save").onclick=()=>{
 const name=$("name").value.trim(), weight=parseInt($("weight").value,10), last=$("last").value;
 if(!name||!Number.isFinite(weight)||weight<=0||!last){alert("Please enter the truck name, empty weight, and date weighed.");return}
 const id=$("id").value||Date.now().toString();
 const t={id,name,weight,last,next:add30(last),quarry:$("quarry").value.trim(),notes:$("notes").value.trim()};
 const i=trucks.findIndex(x=>x.id===id);if(i<0)trucks.push(t);else trucks[i]=t;
 if(saveData()){close();render();alert("Saved! Next empty weight is due "+df(t.next)+".")}
};
$("list").onclick=e=>{let b=e.target.closest("button");if(!b)return;let t=trucks.find(x=>x.id===(b.dataset.new||b.dataset.edit||b.dataset.del));if(b.dataset.new){let w=prompt("New empty weight (lb):",t.weight);if(w===null)return;let n=parseInt(w,10);if(!n)return alert("Enter a valid weight.");t.weight=n;t.last=today();t.next=add30(t.last);saveData();render()}else if(b.dataset.edit)open(t);else if(b.dataset.del&&confirm("Delete this truck?")){trucks=trucks.filter(x=>x.id!==t.id);saveData();render()}};
load();render();
</script></body></html>
